# 맥의 cloudflared 설정 견본 — 채워서 ~/.cloudflared/config.yml 로 둡니다.
# 윈도우 config.yml 과 같은 모양입니다 (docs/배포-안내.md 3장).
#
# **이름과 경로 자리(tunnel · credentials-file 줄)를 채웁니다** — 자격증명 파일(터널 id 이름의 .json)은 비밀이라
# 저장소에 경로도 값도 안 둡니다. 자격증명 파일 권한은 600 으로 둡니다.
# **맥용 새 터널의 이름을 적습니다**(docs/맥-이전.md 8-5) — 윈도우의 옛 터널 이름을 적으면
# 커넥터가 둘이 되어 요청이 두 서버로 갈립니다.

tunnel: ○○
credentials-file: /Users/○○/.cloudflared/○○.json

# 로그 수준 — 기본(info)은 연결마다 줄을 남겨 data/launchd-tunnel.log 가 금세 큰다.
# warn 이면 끊김·재연결 실패 같은 것만 남는다. 문제를 쫓을 때만 info 로 올린다.
# (도는 동안 미는 것은 scripts/mac/로그밀기.sh 가 한다)
loglevel: warn
transport-loglevel: warn

ingress:
  # docs/배포-안내.md 3장 · app/config.py 의 DCB_BASE_URL 기본값과 같은 값
  - hostname: retreat.recba12.com
    service: http://127.0.0.1:8000
  - service: http_status:404
