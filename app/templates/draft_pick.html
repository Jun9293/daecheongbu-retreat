{% extends "retreat_base.html" %}
{% block title %}회차 준비 · 어느 부서 칸{% endblock %}
{% block body %}
<main class="wiz">
  <h2>어느 부서의 칸을 채울까요</h2>
  <p class="lead">
    부서가 여럿입니다 — 리더인 부서가 둘 이상이거나, 리더 없이 팀원으로 둘
    이상일 때 이 화면이 뜹니다 (③). 한 칸씩 채웁니다 — 어느 칸을 채울지 고르세요.
  </p>
  <ul class="picklist">
    {% for c in choices %}
    <li><a class="btn" href="/draft?department={{ c.key|urlencode }}">{{ c.name }}</a></li>
    {% endfor %}
  </ul>
</main>
{% endblock %}
