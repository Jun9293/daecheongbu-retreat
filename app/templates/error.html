{% extends "base.html" %}

{% block title %}{{ status_code }} 오류{% endblock %}

{% block auth_content %}
<div class="auth-wrap">
  <div class="auth center">
    <div class="card"><div class="card-body" style="padding:32px 24px">
      <div style="font-size:40px;font-weight:800;letter-spacing:-.04em;color:var(--ink-3)">{{ status_code }}</div>

      <a class="btn" href="/">홈으로</a>
    </div></div>
  </div>
</div>
{% endblock %}

{% block content %}
<div class="card" style="max-width:420px;margin:8vh auto;text-align:center">
  <div class="card-body" style="padding:32px 24px">
    <div style="font-size:40px;font-weight:800;letter-spacing:-.04em;color:var(--ink-3)">{{ status_code }}</div>
    <p style="margin:8px 0 20px">{{ detail }}</p>
    <a class="btn" href="/">홈으로</a>
  </div>
</div>
