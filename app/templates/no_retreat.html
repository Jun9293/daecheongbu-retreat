{% extends "retreat_base.html" %}
{% block title %}시작하기{% endblock %}
{% block body %}
<main class="barewrap">
  <div class="barecard center">
    <h1>수련회 회차가 없습니다</h1>
    <p class="dim">모든 일정·할 일·예산은 <b>수련회 회차</b> 단위로 관리됩니다.<br>먼저 회차를 만들어주세요.</p>
    {% if is_admin(user) %}
    <a class="sbtn p" href="/setup">새 회차 만들기</a>
    {% else %}
    <p class="dim">총무팀(관리자)이 회차를 만들면 이용할 수 있습니다.</p>
    {% endif %}
  </div>
</main>
{% endblock %}
